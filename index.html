<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Merry Christmas — My Christmas Meat</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0b1220; color:#fff; margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { max-width:800px; padding:32px; background: linear-gradient(135deg,#2b3a67,#8b1f1f); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
    h1 { margin:0 0 8px; font-size:2.4rem; color:#ffd700; text-shadow:0 2px 6px rgba(0,0,0,.4) }
    p { line-height:1.5; margin:16px 0; color:#fffaf0; }
    .cta { display:inline-block; background:#ffd700; color:#111; padding:12px 18px; border-radius:8px; text-decoration:none; font-weight:700; }
    img { max-width:100%; border-radius:8px; margin-top:12px; }
    footer { margin-top:18px; font-size:0.9rem; opacity:0.9 }
  </style>
</head>
<body>
  <div class="card">
    <h1>Merry Christmas!</h1>
    <p>Seasons greetings from URISURGE AI. This holiday we’re celebrating with a special request: If you’d like to share some Christmas meat as a festive gift, we’d be delighted!</p>
    <p>
      <a class="cta" href="https://github.com/urisurgeai" target="_blank" rel="noopener">
        Send Meat to URISURGE AI
      </a>
    </p>
    <img src="https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder" alt="Festive roast">
    <footer>Thanks for the holiday cheer — Happy Holidays from URISURGE AI!</footer>
  </div>
</body>
</html>
